<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Nhập Giftcode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            color: #fff;
        }
        .logo-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,204,0,0.5);
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ddd;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 8px rgba(255,204,0,0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff9900, #ff5500);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 85, 0, 0.6);
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            min-height: 20px;
        }
        .success { color: #00ff88; }
        .error { color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-title">NHẬP CODE NHẬN THƯỞNG</div>

        <div class="form-group">
            <label for="username">Tên tài khoản / ID:</label>
            <input type="text" id="username" placeholder="Nhập tên tài khoản của bạn...">
        </div>

        <div class="form-group">
            <label for="giftcode">Mã Giftcode:</label>
            <input type="text" id="giftcode" placeholder="Nhập mã code tại đây..." style="text-transform: uppercase;">
        </div>

        <button class="btn-submit" onclick="submitCode()">Xác Nhận Nhận Quà</button>

        <div id="message"></div>
    </div>

    <script>
        function submitCode() {
            var user = document.getElementById("username").value.trim();
            var code = document.getElementById("giftcode").value.trim();
            var msg = document.getElementById("message");

            if (user === "" || code === "") {
                msg.className = "error";
                msg.innerHTML = "⚠️ Vui lòng điền đầy đủ Tên tài khoản và Mã code!";
                return;
            }

            // Giả lập kiểm tra mã code
            msg.className = "success";
            msg.innerHTML = "🎉 Nhận code thành công! Hệ thống đang xử lý...";
        }
    </script>

</body>
</html>
